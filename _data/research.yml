- title: "Social Communication in ASD"
  image: "jade2026assessing.png"
  desc: "Assessing Social Conversation in Autism Spectrum Disorder Through Lexical and Syntactic Pipeline Analysis​."

- title: "Spatial cognition and language in ASD"
  image: "jade2025spatial.png"
  desc: "Analyzed a diverse battery of behavioral measures to evaluate the selective dissociation between structural language abilities and visuospatial processing in autistic population, and to identify cognitive markers that best differentiate autistic individuals from neurotypical peers. Devised a standardized set of phonotactically legal nonword linguistic stimuli to validate novel experimental paradigms for cognitive dissociation."

- title: "Cognitive Control"
  image: "eeg.png"
  desc: "Spearheaded the acquisition of EEG and behavioral datasets from a developmental cohort (children aged 4–8) to evaluate cognitive control dynamics."

- title: "Dyslexia"
  image: "dyslexia.png"
  desc: "Coordinated and executed behavioural data collection, leveraging PsychoPy and OpenHandWrite to precisely quantify spelling accuracy and latency markers in developmental populations, culminating in a stroke-level large-scale database of Chinese character handwriting."

- title: "Continuation Translation Task"
  image: "jade2023effect.png"
  desc: "Effect of Timing of the Model Text on Alignment in the Iterative Continuation Translation Task."
